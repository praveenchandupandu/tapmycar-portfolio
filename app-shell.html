<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TapMyCar</title>
<style>
  :root{ --or:#FF6B00; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#FCF9F6; overflow:hidden; font-family:'Inter',system-ui,-apple-system,sans-serif; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* pager */
  #vp{ position:relative; flex:1 1 auto; overflow:hidden; touch-action:pan-y; }
  #track{ display:flex; height:100%; will-change:transform; }
  .slot{ flex:0 0 auto; height:100%; position:relative; background:#FCF9F6; }
  .slot iframe{ width:100%; height:100%; border:0; display:block; background:#FCF9F6; }
  .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .spin{ width:34px; height:34px; border-radius:50%; border:3px solid #F0D8C4; border-top-color:var(--or); animation:sp .8s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  /* nav */
  .tmc-fnav{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; align-items:flex-start; justify-content:center; gap:4px; padding:8px 8px 6px; background:rgba(255,255,255,0.9); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border-radius:28px; box-shadow:0 8px 28px rgba(0,0,0,.12), 0 0 0 1px rgba(255,255,255,.6); width:max-content; max-width:calc(100% - 24px); z-index:5; }
  .tmc-fnav-glow{ position:absolute; left:0; top:0; width:40px; height:40px; border-radius:50%; background:#FF6B00; box-shadow:0 0 0 3px rgba(255,107,0,.20), 0 4px 14px rgba(255,107,0,.50), 0 0 30px rgba(255,107,0,.50); z-index:0; will-change:transform; pointer-events:none; }
  .tmc-fnav-glow::after{ content:''; position:absolute; inset:0; border-radius:50%; background:linear-gradient(180deg, rgba(255,255,255,.60) 0%, rgba(255,255,255,.18) 42%, rgba(255,255,255,0) 60%, rgba(0,0,0,.06) 100%); }
  .tmc-fnav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:0 4px; background:transparent; border:none; cursor:pointer; min-width:52px; font-family:inherit; position:relative; z-index:1; }
  .tmc-fnav-icon{ width:40px;height:40px;border-radius:50%; display:flex;align-items:center;justify-content:center;background:transparent; }
  .tmc-fnav-icon svg{ width:18px;height:18px;stroke:#6B7280;fill:transparent;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .22s,fill .22s; }
  .tmc-fnav-label{ font-size:10px;font-weight:600;color:#9CA3AF;letter-spacing:.02em;line-height:1;transition:color .22s; }
  .tmc-fnav-item.active .tmc-fnav-icon svg{ stroke:#fff;fill:#fff;fill-opacity:.20; }
  .tmc-fnav-item.active .tmc-fnav-label{ color:var(--or);font-weight:700; }
</style>
</head>
<body>
  <div id="app">
    <div id="vp">
      <div id="track">
        <div class="slot" data-src="/dashboard.html"><div class="ph"><div class="spin"></div></div></div>
        <div class="slot" data-src="/manage.html"><div class="ph"><div class="spin"></div></div></div>
        <div class="slot" data-src="/verify.html"><div class="ph"><div class="spin"></div></div></div>
        <div class="slot" data-src="/activity.html"><div class="ph"><div class="spin"></div></div></div>
        <div class="slot" data-src="/settings.html"><div class="ph"><div class="spin"></div></div></div>
      </div>
    </div>

    <nav class="tmc-fnav" id="nav" aria-label="Main navigation">
      <div class="tmc-fnav-glow" id="glow"></div>
      <button class="tmc-fnav-item active" data-index="0"><div class="tmc-fnav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><span class="tmc-fnav-label">Home</span></button>
      <button class="tmc-fnav-item" data-index="1"><div class="tmc-fnav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></div><span class="tmc-fnav-label">Tag</span></button>
      <button class="tmc-fnav-item" data-index="2"><div class="tmc-fnav-icon"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><span class="tmc-fnav-label">Verify</span></button>
      <button class="tmc-fnav-item" data-index="3"><div class="tmc-fnav-icon"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div><span class="tmc-fnav-label">Activity</span></button>
      <button class="tmc-fnav-item" data-index="4"><div class="tmc-fnav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><span class="tmc-fnav-label">Profile</span></button>
    </nav>
  </div>

<script>
(function(){
  var vp = document.getElementById('vp');
  var track = document.getElementById('track');
  var slots = track.children;
  var nav = document.getElementById('nav');
  var navItems = nav.querySelectorAll('.tmc-fnav-item');
  var icons = nav.querySelectorAll('.tmc-fnav-icon');
  var glow = document.getElementById('glow');
  var n = slots.length;
  var index = 0, vw = 0, centers = [], glowW = 40;
  var EASE = 'transform .30s cubic-bezier(.22,.61,.36,1)';
  var IFRAME_ALLOW = 'camera; microphone; geolocation; autoplay; fullscreen';

  function ensureLoaded(i){
    var slot = slots[i];
    if (slot.getAttribute('data-loaded')) return;
    slot.setAttribute('data-loaded','1');
    var ifr = document.createElement('iframe');
    ifr.setAttribute('allow', IFRAME_ALLOW);
    ifr.setAttribute('scrolling','yes');
    ifr.src = slot.getAttribute('data-src');
    ifr.addEventListener('load', function(){ wireIframe(ifr); var ph = slot.querySelector('.ph'); if (ph) ph.remove(); });
    slot.appendChild(ifr);
  }

  function wireIframe(ifr){
    try {
      var d = ifr.contentWindow.document;
      // hide the page's own floating nav (we use the shell's)
      var st = d.createElement('style'); st.textContent = '.tmc-fnav{display:none !important;}'; (d.head || d.documentElement).appendChild(st);
      // forward swipes that start over the page content to the shell
      d.addEventListener('pointerdown', function(e){ dragStart(e.clientX, e.clientY); }, {passive:true});
      d.addEventListener('pointermove', function(e){ dragMove(e.clientX, e.clientY, e); }, {passive:false});
      d.addEventListener('pointerup', function(){ dragEnd(); }, {passive:true});
      d.addEventListener('pointercancel', function(){ dragEnd(); }, {passive:true});
    } catch (err) { /* cross-origin or timing: taps still work */ }
  }

  function measure(){
    vw = vp.clientWidth;
    for (var i=0;i<n;i++){ slots[i].style.width = vw + 'px'; }
    track.style.width = (vw*n) + 'px';
    var navRect = nav.getBoundingClientRect();
    centers = [];
    for (var j=0;j<icons.length;j++){
      var r = icons[j].getBoundingClientRect();
      centers.push(r.left - navRect.left + r.width/2);
      if (j===0){ glowW = r.width; glow.style.width=r.width+'px'; glow.style.height=r.height+'px'; glow.style.top=(r.top-navRect.top)+'px'; }
    }
    setX(false); glowTo(index, false);
  }
  function setX(animate){ track.style.transition = animate ? EASE : 'none'; track.style.transform = 'translate3d(' + (-index*vw) + 'px,0,0)'; }
  function glowTo(pagePos, animate){
    pagePos = Math.max(0, Math.min(n-1, pagePos));
    var lo=Math.floor(pagePos), hi=Math.min(lo+1,n-1), f=pagePos-lo;
    var cx = centers[lo] + (centers[hi]-centers[lo])*f;
    glow.style.transition = animate ? EASE : 'none';
    glow.style.transform = 'translateX(' + (cx - glowW/2) + 'px)';
    var act = Math.round(pagePos);
    for (var k=0;k<navItems.length;k++){ navItems[k].classList.toggle('active', k===act); }
  }
  function go(i, animate){
    index = Math.max(0, Math.min(n-1, i));
    ensureLoaded(index);
    setX(animate !== false);
    glowTo(index, animate !== false);
  }

  var dragging=false, startX=0, startY=0, dx=0, axisLock=null;
  function dragStart(x,y){ dragging=true; axisLock=null; startX=x; startY=y; dx=0; track.style.transition='none'; }
  function dragMove(x,y,ev){
    if(!dragging) return;
    var mx=x-startX, my=y-startY;
    if(axisLock===null && (Math.abs(mx)>6 || Math.abs(my)>6)) axisLock = Math.abs(mx)>Math.abs(my) ? 'x':'y';
    if(axisLock!=='x') return;
    if(ev && ev.cancelable) ev.preventDefault();
    dx=mx;
    var xx=-index*vw+dx;
    if(index===0 && dx>0) xx=-index*vw+dx*0.35;
    if(index===n-1 && dx<0) xx=-index*vw+dx*0.35;
    track.style.transform='translate3d(' + xx + 'px,0,0)';
    glowTo(-xx/vw, false);
  }
  function dragEnd(){
    if(!dragging) return; dragging=false;
    if(axisLock!=='x'){ return; }
    var t=vw*0.16;
    if(dx<=-t) go(index+1,true);
    else if(dx>=t) go(index-1,true);
    else go(index,true);
  }
  vp.addEventListener('pointerdown', function(e){ dragStart(e.clientX,e.clientY); });
  vp.addEventListener('pointermove', function(e){ dragMove(e.clientX,e.clientY,e); });
  vp.addEventListener('pointerup', dragEnd);
  vp.addEventListener('pointercancel', dragEnd);

  nav.addEventListener('click', function(e){ var item=e.target.closest('.tmc-fnav-item'); if(!item) return; go(parseInt(item.getAttribute('data-index'),10), true); });

  window.addEventListener('resize', measure);
  measure();
  ensureLoaded(0); // load Home immediately
})();
</script>
</body>
</html>
