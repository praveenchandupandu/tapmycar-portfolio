<body>
<div class="chev"></div>

<div id="step1" style="display:flex;flex-direction:column;min-height:calc(100dvh - 6px);padding:16px 20px 0">
  <div style="text-align:center;margin-bottom:32px;padding-top:24px">
    <div style="text-align:center;font-size:36px;font-weight:900;color:#111;letter-spacing:-2.5px;line-height:1;margin:0 auto 20px"><span style="white-space:nowrap;display:inline-block">Tap<span style="color:#FF6B00">My</span>Car</span></div>
    <div style="font-size:13px;color:#6B7280">Enter your email to sign in</div>
  </div>

  <div class="field">
    <label>Email address</label>
    <div style="display:flex;gap:8px;align-items:flex-end">
      <div style="flex:1">
        <input type="email" id="email" placeholder="jane@example.com" autocomplete="email"
          style="width:100%;height:46px;border:1.5px solid #E5E7EB;border-radius:11px;padding:0 14px;font-size:14px;font-family:inherit;background:#F9FAFB;outline:none"
          onkeydown="if(event.key==='Enter') sendOTP()">
      </div>
      <button onclick="sendOTP()"
        style="background:#FF6B00;color:#fff;font-size:13px;font-weight:700;padding:0 18px;height:46px;border:none;border-radius:11px;cursor:pointer;white-space:nowrap;font-family:inherit">

  </div>

  <div class="otp-row" style="margin-top:8px">
    <input class="otp-box" type="tel" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
    <input class="otp-box" type="tel" maxlength="1">
    <input class="otp-box" type="tel" maxlength="1">
    <input class="otp-box" type="tel" maxlength="1">
    <input class="otp-box" type="tel" maxlength="1">
    <input class="otp-box" type="tel" maxlength="1">
  </div>

  <div style="text-align:center;margin-top:10px;margin-bottom:16px">
    <button id="resend-btn" onclick="sendOTP()"
      style="background:none;border:none;color:#FF6B00;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit">
      Resend code
    </button>
  </div>

  <div class="info-box" style="margin-bottom:20px">

<div style="padding:16px 20px 8px;text-align:center;background:#fff">

<div class="toast" id="toast"><div class="toast-ic"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><span id="toast-msg"></span></div>

<script src="/app.js"></script>
<script>
async function sendOTP() {
  const email = document.getElementById('email').value.trim();
  if (!email) { showToast('Enter your email first'); return; }
  if (!email.includes('@')) { showToast('Enter a valid email address'); return; }
  try {
    const res  = await fetch('/api/send-otp', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, type: 'email', mode: 'signin' })
    });
    const data = await res.json();
    if (data.success) {
      showToast('Code sent to ' + email);
      startCountdown('resend-btn');
      const boxes = document.querySelectorAll('.otp-box');
      if (boxes[0]) boxes[0].focus();
    } else {
      showToast(data.error || 'Failed to send code');
    }
  } catch(e) { showToast('Network error'); }
}

async function signIn() {
  const email = document.getElementById('email').value.trim();
  if (!email) { showToast('Enter your email address'); return; }
  const code = getOTPValue();
  if (code.length < 6) { showToast('Enter the 6-digit code'); return; }
  try {
    const res  = await fetch('/api/verify-otp', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, code, type: 'email', mode: 'signin' })
    });
    const data = await res.json();
    if (data.token) {
      saveSession(data.token, data.phone || '', data.name || '', data.session_token); /* TMC_PATCH38S3 */
      localStorage.setItem('tmc_email', email);
      /* TMC_PATCH34B_CONTINUE: honor ?continue= if present and safe (relative path) */
      var _p34bDest = '/dashboard.html';
      try {
        var _p34bUrl = new URL(window.location.href);
        var _p34bCont = _p34bUrl.searchParams.get('continue');
        if (_p34bCont && _p34bCont.indexOf('/') === 0 && _p34bCont.indexOf('//') !== 0 && _p34bCont.indexOf('://') === -1) {
          _p34bDest = _p34bCont;
        }
      } catch (e) {}
      window.location.href = _p34bDest;
    } else {
      showToast(data.error || 'Wrong code  try again');
    }
  } catch(e) { showToast('Network error'); }
}
</script>



<script>
/* TMC_PATCH17_IDLE_LOGOUT: show idle-signout note if redirected with ?reason=idle */
(function() {
  try {
    var url = new URL(window.location.href);
    if (url.searchParams.get('reason') !== 'idle') return;
    var n = document.createElement('div');
    n.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#FFF3EC;border:1.5px solid #FFD7BA;color:#7C2D12;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:99px;z-index:9999;box-shadow:0 6px 16px rgba(0,0,0,.08);font-family:inherit';
    n.textContent = 'You were signed out for inactivity. Sign in to continue.';
    document.addEventListener('DOMContentLoaded', function() { document.body.appendChild(n); });
    if (document.readyState !== 'loading') document.body.appendChild(n);
    // Clean the URL so reload doesn't keep the banner
    url.searchParams.delete('reason');
    history.replaceState(null, '', url.pathname + (url.search ? url.search : ''));
  } catch (e) {}
})();
</script>
<!-- TMC_PATCH26_APP_SETTINGS: signin.footer slot -->
<div data-tmc-slot="signin.footer" style="padding:12px 24px 24px;text-align:center"></div>
<script src="/app-settings.js" defer></script>
