<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FF6B00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TapMyCar">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Settings — TapMyCar</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="nav"><div class="bk" onclick="history.back()"><div class="bkb"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div><span class="bk-label">Settings</span></div></div>
<div class="chev"></div>
<div class="page">
  <div style="padding:20px 20px 14px;text-align:center"><div style="width:68px;height:68px;border-radius:50%;background:var(--or);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff" id="profile-av">U</div><div style="font-size:18px;font-weight:800;color:var(--bk);margin-bottom:3px" id="profile-name">User</div><div style="font-size:12px;color:var(--gy);margin-bottom:10px" id="profile-phone">—</div><div style="display:inline-flex;align-items:center;gap:4px;background:var(--orl);border:.5px solid var(--orl2);border-radius:99px;padding:4px 14px;font-size:11px;font-weight:600;color:var(--or)">⭐ Standard plan</div></div>
  <div class="sl">Tag</div>
  <div class="set-row" onclick="window.location.href='/etag.html'"><div class="set-l"><div class="set-ic" style="background:var(--orl)"><svg viewBox="0 0 24 24" stroke="var(--or)"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></div><div><div class="set-t">Manage tag</div><div class="set-s">View your eTag</div></div></div><div class="arr"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div></div>
  <div class="sl">Notifications</div>
  <div class="set-row"><div class="set-l"><div class="set-ic" style="background:var(--orl)"><svg viewBox="0 0 24 24" stroke="var(--or)"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div><div><div class="set-t">SMS alerts</div><div class="set-s">When tag is scanned</div></div></div><button class="tog on" onclick="this.classList.toggle('on')"><div class="tog-d"></div></button></div>
  <div class="sl">Plan & billing</div>
  <div class="set-row" onclick="window.location.href='/pricing.html'"><div class="set-l"><div class="set-ic" style="background:var(--orl)"><svg viewBox="0 0 24 24" stroke="var(--or)"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div><div><div class="set-t">Manage plan</div><div class="set-s">View pricing</div></div></div><div class="arr"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div></div>
  <div class="sl">Support</div>
  <div class="set-row"><div class="set-l"><div class="set-ic" style="background:var(--gb)"><svg viewBox="0 0 24 24" stroke="var(--gy)"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div><div class="set-t">Help & FAQ</div></div></div><div class="arr"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div></div>
  <div class="set-row" onclick="signOut()"><div class="set-l"><div class="set-ic" style="background:var(--rdl)"><svg viewBox="0 0 24 24" stroke="var(--rd)"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div><div><div class="set-t" style="color:var(--rd)">Sign out</div></div></div><div class="arr"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div></div>
  <div style="padding:20px;text-align:center"><div style="font-size:11px;color:#CCC">TapMyCar v1.0.0 · Praman Tech LLC · Connecticut</div></div>
</div>
<script src="/app.js"></script>
<script>
requireAuth();
const s = getSession();
if(s.name){document.getElementById('profile-name').textContent=s.name;document.getElementById('profile-av').textContent=s.name[0].toUpperCase();}
if(s.phone){document.getElementById('profile-phone').textContent=s.phone;}
function signOut(){localStorage.clear();window.location.href='/signin.html';}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
