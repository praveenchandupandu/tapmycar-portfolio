<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Your free eTag — TapMyCar</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="nav"><div class="bk" onclick="history.back()"><div class="bkb"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div><span class="bk-label">Your free eTag</span></div><button class="gear" onclick="window.location.href='/settings.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
<div class="chev"></div><div class="tape"></div>
<div class="page-inner" style="display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:24px">
  <div class="sticker" style="width:200px">
    <div class="sticker-chev"></div><div class="sticker-tape"></div>
    <div class="sticker-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:15px;font-weight:800;color:var(--bk)">TapMyCar<span style="color:var(--or)">.</span></div><div style="font-size:9px;color:var(--gy)">#TMC-00001</div></div>
      <div style="background:#fff;border:2px solid var(--or);border-radius:10px;width:100px;height:100px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center"><svg width="86" height="86" viewBox="0 0 21 21"><rect x="1" y="1" width="7" height="7" fill="none" stroke="#111" stroke-width="1.2"/><rect x="2.5" y="2.5" width="4" height="4" fill="#111"/><rect x="13" y="1" width="7" height="7" fill="none" stroke="#111" stroke-width="1.2"/><rect x="14.5" y="2.5" width="4" height="4" fill="#111"/><rect x="1" y="13" width="7" height="7" fill="none" stroke="#111" stroke-width="1.2"/><rect x="2.5" y="14.5" width="4" height="4" fill="#111"/><rect x="10" y="1" width="1.5" height="1.5" fill="#111"/><rect x="10" y="4" width="1.5" height="1.5" fill="#111"/><rect x="13" y="10" width="1.5" height="1.5" fill="#111"/><rect x="16" y="10" width="1.5" height="1.5" fill="#111"/><rect x="10" y="13" width="1.5" height="1.5" fill="#111"/><rect x="16" y="16" width="4" height="4" fill="#111"/></svg></div>
      <div style="text-align:center;font-size:10px;color:var(--gy)">Scan to reach vehicle owner</div>
    </div>
    <div class="sticker-tape"></div><div class="sticker-chev"></div>
  </div>
  <div style="text-align:center"><div style="font-size:17px;font-weight:800;color:var(--bk);margin-bottom:3px" id="tag-name">Your eTag</div><div style="font-size:12px;color:var(--gy)">All instructions included in PDF</div></div>
  <button class="btn-g" id="dl-btn" onclick="downloadEtag()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download free eTag PDF</button>
  <div onclick="window.location.href='/activate.html'" style="width:100%;display:flex;align-items:center;gap:10px;background:var(--orl);border-radius:13px;padding:13px 16px;border:.5px solid var(--orl2);cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--or)" stroke-width="2" stroke-linecap="round" style="flex-shrink:0"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><div style="font-size:12px;color:#9A3800;font-weight:500;flex:1">Activate to enable masked calls</div><div style="font-size:12px;font-weight:700;color:var(--or)">Activate →</div></div>
  <div onclick="window.location.href='/dashboard.html'" style="width:100%;text-align:center;font-size:13px;color:var(--gy);cursor:pointer;padding:8px">Go to Dashboard</div>
</div>
<div class="toast" id="toast"><div class="toast-ic"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><span id="toast-msg"></span></div>
<script src="/app.js"></script>
<script>
requireAuth();
const s = getSession();
if (s.name) document.getElementById('tag-name').textContent = s.name + ' · #TMC-00001';
function downloadEtag() {
  const btn = document.getElementById('dl-btn');
  btn.innerHTML = '✓ Downloaded';
  btn.style.background = 'var(--gn)';
  showToast('eTag saved to your phone · Find it in your Downloads folder');
}
</script>
</body>
</html>
