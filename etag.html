<body>

<div class="chev"></div><div class="tape"></div>
<div class="page-inner" style="display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:24px">
  <div class="sticker" style="width:200px">
    <div class="sticker-chev"></div><div class="sticker-tape"></div>
    <div class="sticker-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:15px;font-weight:800;color:var(--bk)">TapMyCar<span style="color:var(--or)">.</span></div><div style="font-size:9px;color:var(--gy)" id="sticker-token">#---</div></div>
      <div id="qr-preview" style="background:#fff;border:2px solid var(--or);border-radius:10px;width:100px;height:100px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;overflow:hidden"></div>

  <div style="text-align:center"><div style="font-size:17px;font-weight:800;color:var(--bk);margin-bottom:3px" id="tag-name">Your eTag</div><div style="font-size:12px;color:var(--gy)">Privacy for you. Safety for your car.</div></div>
  <button class="btn-g" id="dl-btn" onclick="downloadEtag()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download free eTag PDF</button>

<!-- Hidden elements for PDF generation -->
<div id="qr-hidden" style="position:absolute;left:-9999px;top:-9999px"></div>
<canvas id="sticker-canvas" style="display:none"></canvas>
<img id="template-img" src="/tapmycarintialstage.png" crossorigin="anonymous" style="display:none">

<div class="toast" id="toast"><div class="toast-ic"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><span id="toast-msg"></span></div>
<script src="/app.js"></script>
<script>
requireAuth();
const s = getSession();
let tagToken = '';
let tagURL = '';

async function loadTagData() {
  try {
    const res = await fetch('/api/get-dashboard?user_id=' + s.token);
    const data = await res.json();
    if (data.tags && data.tags.length > 0) {
      const tag = data.tags[0];
      tagToken = tag.token;
      tagURL = 'https://tapmycar.io/tag/' + tag.token;
      const label = tag.vehicle_label || s.name || 'Your eTag';
      document.getElementById('tag-name').textContent = label + ' · #' + tag.token;
      document.getElementById('sticker-token').textContent = '#' + tag.token;

      // QR for preview
      document.getElementById('qr-preview').innerHTML = '';
      new QRCode(document.getElementById('qr-preview'), {
        text: tagURL, width: 90, height: 90,
        colorDark: '#111111', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      // QR for PDF (larger)
      document.getElementById('qr-hidden').innerHTML = '';
      new QRCode(document.getElementById('qr-hidden'), {
        text: tagURL, width: 400, height: 400,
        colorDark: '#111111', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    }
  } catch(e) { console.error(e); }
}

function buildStickerImage() {
  return new Promise((resolve) => {
    const templateImg = document.getElementById('template-img');
    const canvas = document.getElementById('sticker-canvas');
    const ctx = canvas.getContext('2d');

    // Original image is 1200x1200, crop to chevron: (18,39)-(1170,1147) = 1152x1108
    const cropX=18, cropY=39, cropW=1152, cropH=1108;
    canvas.width = cropW;
    canvas.height = cropH;

    // Draw cropped template
    ctx.drawImage(templateImg, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

    // Draw QR code at position (adjusted for crop offset)
    // Original: x=403,y=514 → cropped: x=385,y=475
    const qrCanvas = document.querySelector('#qr-hidden canvas');
    if (qrCanvas) {
      ctx.drawImage(qrCanvas, 385, 475, 355, 355);
    }

    // Draw tag ID text
    // Original: x=694,y=125 → cropped: x=676,y=86
    ctx.font = 'bold 34px Arial Black, Impact, sans-serif';
    ctx.fillStyle = '#FFFFFF';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText('#' + tagToken, 676, 86 + 30);
    ctx.shadowBlur = 0;

    // Apply rounded corners by clipping
    const radius = 50;
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = cropW;
    tempCanvas.height = cropH;
    const tCtx = tempCanvas.getContext('2d');

    // Draw rounded rect path
    tCtx.beginPath();
    tCtx.moveTo(radius, 0);
    tCtx.lineTo(cropW - radius, 0);
    tCtx.quadraticCurveTo(cropW, 0, cropW, radius);
    tCtx.lineTo(cropW, cropH - radius);
    tCtx.quadraticCurveTo(cropW, cropH, cropW - radius, cropH);
    tCtx.lineTo(radius, cropH);
    tCtx.quadraticCurveTo(0, cropH, 0, cropH - radius);
    tCtx.lineTo(0, radius);
    tCtx.quadraticCurveTo(0, 0, radius, 0);
    tCtx.closePath();
    tCtx.clip();

    // Draw the sticker inside the clip
    tCtx.drawImage(canvas, 0, 0);

    resolve(tempCanvas.toDataURL('image/png'));
  });
}

async function downloadEtag() {
  const btn = document.getElementById('dl-btn');
  btn.innerHTML = 'Generating PDF...';
  btn.disabled = true;

  // Wait for template image to load
  const templateImg = document.getElementById('template-img');
  if (!templateImg.complete) {
    await new Promise(r => { templateImg.onload = r; });
  }

  setTimeout(async () => {
    try {
      const stickerDataURL = await buildStickerImage();
      const { jsPDF } = window.jspdf;

      // Page 1 — Sticker (letter size: 215.9 x 279.4 mm)
      const doc = new jsPDF({ unit: 'mm', format: 'letter' });
      const pw = 215.9, ph = 279.4;

      // Sticker 4x4 inches = 101.6mm, aspect ratio 1108/1152
      const sW = 101.6;
      const sH = 101.6 * (1108/1152);
      const sX = (pw - sW) / 2;
      const sY = (ph - sH) / 2 - 10;
      doc.addImage(stickerDataURL, 'PNG', sX, sY, sW, sH);

      doc.setTextColor(107, 114, 128);
      doc.setFontSize(8);
      doc.text('Print at actual size  ·  Cut to 4×4 inches  ·  Place inside rear windshield facing outward', pw/2, sY + sH + 8, {align:'center'});

      // Page 2 — Welcome
      doc.addPage();
      doc.setFillColor(255,107,0);
      doc.rect(0, 0, pw, 30, 'F');
      doc.setTextColor(255,255,255);
      doc.setFontSize(24);
      doc.setFont('helvetica','bold');
      doc.text('Welcome to TapMyCar!', pw/2, 14, {align:'center'});
      doc.setFontSize(11);
      doc.setFont('helvetica','normal');
      doc.text('Privacy for you. Safety for your car.', pw/2, 23, {align:'center'});
      doc.setFillColor(17,17,17);
      doc.rect(0, 30, pw, 1.5, 'F');

      let y = 42;
      doc.setTextColor(17,17,17);
      doc.setFontSize(14);
      doc.setFont('helvetica','bold');
      doc.text('Thank you for choosing TapMyCar!', pw/2, y, {align:'center'});
      y += 12;

      doc.setFontSize(10);
      doc.setFont('helvetica','normal');
      doc.setTextColor(55,65,81);
      const welcomeLines = [
        'You just made the smartest decision for your vehicle.',
        '',
        'Every day, millions of cars sit parked with no way for anyone to reach',
        'the owner. Someone hits your car — they drive away. Your headlights are',
        'on — your battery dies. You\'re blocking someone — they get frustrated.',
        '',
        'TapMyCar changes that. Now anyone can reach you instantly about your',
        'vehicle — without ever seeing your real phone number. Your identity',
        'stays completely private. Your car stays completely protected.',
        '',
        'Think of it as a safety precaution you never knew you needed — until now.'
      ];
      welcomeLines.forEach(line => { doc.text(line, pw/2, y, {align:'center'}); y += 5.5; });

      y += 5;
      doc.setDrawColor(255,107,0); doc.setLineWidth(0.7);
      doc.line(pw/2 - 30, y, pw/2 + 30, y);
      y += 10;

      doc.setTextColor(255,107,0);
      doc.setFontSize(11);
      doc.setFont('helvetica','bold');
      doc.text('Your Tag Details', pw/2, y, {align:'center'});
      y += 8;

      doc.setTextColor(17,17,17);
      doc.setFontSize(10);
      doc.setFont('helvetica','normal');
      doc.text('Tag ID: #' + tagToken, pw/2, y, {align:'center'}); y += 6;
      doc.text('Scan URL: ' + tagURL, pw/2, y, {align:'center'}); y += 6;
      doc.text('Status: Active & Protected', pw/2, y, {align:'center'});

      doc.setTextColor(107,114,128);
      doc.setFontSize(7);
      doc.text('Praman Tech LLC  ·  New Britain, CT  ·  tapmycar.io', pw/2, ph - 8, {align:'center'});

      // Page 3 — Instructions
      doc.addPage();
      doc.setFillColor(255,107,0);
      doc.rect(0, 0, pw, 24, 'F');
      doc.setTextColor(255,255,255);
      doc.setFontSize(18);
      doc.setFont('helvetica','bold');
      doc.text('How to Use Your eTag', pw/2, 15, {align:'center'});
      doc.setFillColor(17,17,17);
      doc.rect(0, 24, pw, 1.5, 'F');

      y = 36;
      doc.setTextColor(55,65,81);
      doc.setFontSize(9);
      doc.setFont('helvetica','normal');
      doc.text('Setting up takes 2 minutes. Here\'s everything you need to know.', pw/2, y, {align:'center'});
      y += 10;

      const steps = [
        ['1','Print your eTag','Print page 1 of this PDF at actual size on a color printer. For a premium look, use glossy photo paper or sticker paper.'],
        ['2','Cut to 4×4 inches','Carefully cut your eTag to size. The rounded edges give it a clean, professional finish.'],
        ['3','Place inside your rear windshield','Stick it on the INSIDE of your rear window, QR code facing outward. This protects the tag from weather while keeping it scannable.'],
        ['4','You\'re now protected','That\'s it. Your car now has a private safety line. Anyone who needs your attention simply scans the QR with their phone camera — no app needed.'],
        ['5','You stay in control','When someone scans and calls, you hear an automated voice first. Press 1 to send them an auto-reply. Press 2 to talk directly. You decide.'],
        ['6','Your privacy is guaranteed','The caller never sees your real number. You never see theirs. Every interaction is masked, logged, and secure.']
      ];

      steps.forEach(([num, title, desc]) => {
        doc.setFillColor(255,107,0);
        doc.circle(28, y - 1.5, 4, 'F');
        doc.setTextColor(255,255,255);
        doc.setFontSize(10);
        doc.setFont('helvetica','bold');
        doc.text(num, 28, y, {align:'center'});

        doc.setTextColor(17,17,17);
        doc.setFontSize(10);
        doc.setFont('helvetica','bold');
        doc.text(title, 37, y);
        y += 6;

        doc.setTextColor(55,65,81);
        doc.setFontSize(8);
        doc.setFont('helvetica','normal');
        const splitDesc = doc.splitTextToSize(desc, 150);
        doc.text(splitDesc, 37, y);
        y += splitDesc.length * 4 + 8;
      });

      doc.setTextColor(107,114,128);
      doc.setFontSize(7);
      doc.text('Praman Tech LLC  ·  New Britain, CT  ·  tapmycar.io', pw/2, ph - 8, {align:'center'});

      // Page 4 — Why TapMyCar
      doc.addPage();
      doc.setFillColor(255,107,0);
      doc.rect(0, 0, pw, 24, 'F');
      doc.setTextColor(255,255,255);
      doc.setFontSize(18);
      doc.setFont('helvetica','bold');
      doc.text('Why TapMyCar?', pw/2, 12, {align:'center'});
      doc.setFontSize(9);
      doc.setFont('helvetica','normal');
      doc.text('Privacy for you. Safety for your car.', pw/2, 20, {align:'center'});
      doc.setFillColor(17,17,17);
      doc.rect(0, 24, pw, 1.5, 'F');

      y = 36;
      doc.setTextColor(17,17,17);
      doc.setFontSize(11);
      doc.setFont('helvetica','bold');
      doc.text('Without TapMyCar:', 24, y); y += 7;

      doc.setFontSize(8);
      doc.setFont('helvetica','normal');
      doc.setTextColor(220,38,38);
      [
        'Someone hits your parked car — they leave. You find out hours later.',
        'You leave your number on the dashboard — strangers now have your personal info.',
        'Your headlights are on overnight — dead battery, no one could warn you.',
        'You\'re double-parked for 5 minutes — your car gets towed before anyone can reach you.',
        'A pet or child is locked in a hot car — bystanders waste minutes trying to find you.'
      ].forEach(line => { doc.text('✗  ' + line, 28, y); y += 5.5; });

      y += 6;
      doc.setTextColor(17,17,17);
      doc.setFontSize(11);
      doc.setFont('helvetica','bold');
      doc.text('With TapMyCar:', 24, y); y += 7;

      doc.setFontSize(8);
      doc.setFont('helvetica','normal');
      doc.setTextColor(22,163,74);
      [
        'Anyone can reach you in seconds — scan, tap, done.',
        'Your real number is never shown — zero privacy risk.',
        'You screen every call before speaking — full control.',
        'Every scan is logged with time and location — full awareness.',
        'Works 24/7 on any phone — no app needed to contact you.'
      ].forEach(line => { doc.text('✓  ' + line, 28, y); y += 5.5; });

      y += 6;
      doc.setDrawColor(255,107,0); doc.setLineWidth(0.5);
      doc.line(24, y, pw - 24, y); y += 8;

      doc.setTextColor(17,17,17);
      doc.setFontSize(11);
      doc.setFont('helvetica','bold');
      doc.text('Plans', 24, y); y += 7;

      [
        ['eTag (Free)','$1 activation','3 masked calls/month · digital QR · instant setup'],
        ['Standard','$9.99 + $4.99/yr','10 masked calls/month · physical NFC+QR sticker shipped · SMS alerts'],
        ['Premium','$24.99 + $9.99/yr','Unlimited calls · 3 vehicles · scan history · emergency contact'],
        ['Business','$49/month','Fleet dashboard · unlimited vehicles · bulk stickers with logo']
      ].forEach(([name, price, feat]) => {
        doc.setTextColor(255,107,0); doc.setFont('helvetica','bold'); doc.setFontSize(9);
        doc.text(name, 28, y);
        doc.setTextColor(17,17,17); doc.setFontSize(9);
        doc.text(price, 75, y); y += 5;
        doc.setTextColor(55,65,81); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
        doc.text(feat, 28, y); y += 8;
      });

      y += 4;
      doc.setDrawColor(255,107,0); doc.line(24, y, pw - 24, y); y += 8;
      doc.setTextColor(55,65,81); doc.setFontSize(8); doc.setFont('helvetica','normal');
      doc.text('Website: tapmycar.io', 28, y); y += 5;
      doc.text('Email: pramantechllc@gmail.com', 28, y); y += 5;
      doc.text('Dashboard: tapmycar.io/dashboard.html', 28, y);

      doc.setTextColor(107,114,128); doc.setFontSize(7);
      doc.text('© 2026 Praman Tech LLC  ·  New Britain, CT  ·  tapmycar.io', pw/2, ph - 8, {align:'center'});

      // Save
      doc.save('TapMyCar-eTag-' + tagToken + '.pdf');

      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> Downloaded!';
      btn.style.background = 'var(--gn)';
      showToast('eTag PDF saved! Check your Downloads folder.');

      setTimeout(() => {
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download free eTag PDF';
        btn.style.background = 'var(--gn)';
        btn.disabled = false;
      }, 4000);

    } catch(e) {
      console.error('PDF error:', e);
      showToast('Error generating PDF — try again');
      btn.innerHTML = 'Download free eTag PDF';
      btn.disabled = false;
    }
  }, 800);
}

loadTagData();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
