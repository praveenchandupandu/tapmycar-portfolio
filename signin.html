<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sign in — TapMyCar</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="chev"></div>
<div style="display:flex;flex-direction:column;min-height:calc(100vh - 6px);padding:20px">
  <div style="text-align:center;margin-bottom:28px;padding-top:20px">
    <div style="font-size:28px;font-weight:800;color:var(--bk);letter-spacing:-.4px;margin-bottom:4px">TapMyCar<span style="color:var(--or)">.</span></div>
    <div style="font-size:13px;color:var(--gy)">Enter your number to sign in</div>
  </div>
  <div class="field">
    <label>Phone number</label>
    <div style="display:flex;gap:8px;align-items:flex-end">
      <div style="flex:1"><input type="tel" id="phone" placeholder="+1 (203) 555-0100" autocomplete="tel" style="width:100%;height:46px;border:1.5px solid var(--bd);border-radius:11px;padding:0 14px;font-size:14px;font-family:Inter,sans-serif;background:var(--gbl);outline:none"></div>
      <button class="send-otp-btn" onclick="sendOTP()">Send OTP</button>
    </div>
  </div>
  <div class="otp-row" style="margin-top:4px">
    <input class="otp-box" type="tel" maxlength="1">
    <input class="otp-box" type="tel" maxlength="1">
    <input class="otp-box" type="tel" maxlength="1">
    <input class="otp-box" type="tel" maxlength="1">
    <input class="otp-box" type="tel" maxlength="1">
    <input class="otp-box" type="tel" maxlength="1">
  </div>
  <div style="text-align:center;margin-bottom:18px">
    <button id="resend-btn" onclick="sendOTP()" style="background:none;border:none;color:var(--or);font-weight:600;font-size:12px;cursor:pointer;font-family:Inter,sans-serif">Resend code</button>
  </div>
  <div class="info-box" style="margin-bottom:20px">
    <p>After sign in Face ID or fingerprint unlocks the app — no OTP needed daily.</p>
  </div>
  <div style="margin-top:auto">
    <button class="btn" onclick="signIn()">Sign in →</button>
    <div style="text-align:center;font-size:12px;color:var(--gy);margin-top:12px">
      No account? <a href="/register.html" class="link-or">Sign up free</a>
    </div>
  </div>
</div>
<div class="toast" id="toast"><div class="toast-ic"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><span id="toast-msg"></span></div>
<script src="/app.js"></script>
<script>
async function sendOTP() {
  const phone = document.getElementById('phone').value.trim();
  if (!phone) { showToast('Enter your phone number first'); return; }
  startCountdown('resend-btn');
  try {
    const res = await API.sendOTP(phone);
    if (!res.success) showToast(res.error || 'Failed to send OTP');
    else showToast('Code sent!');
  } catch(e) { showToast('Network error'); }
}
async function signIn() {
  const phone = document.getElementById('phone').value.trim();
  const code = getOTPValue();
  if (!phone) { showToast('Enter your phone number'); return; }
  if (code.length < 6) { showToast('Enter all 6 digits'); return; }
  try {
    const res = await API.verifyOTP(phone, code);
    if (res.token) {
      saveSession(res.token, res.phone || phone, res.name || 'User');
      window.location.href = '/dashboard.html';
    } else { showToast(res.error || 'Wrong code'); }
  } catch(e) { showToast('Network error'); }
}
</script>
</body>
</html>
